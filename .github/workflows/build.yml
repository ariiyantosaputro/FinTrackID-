name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buat proyek Android
        run: |
          set -e
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'EOF_FILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.mycompany.fintrackid'
              compileSdk 34
              defaultConfig {
                  applicationId "com.mycompany.fintrackid"
                  minSdk 24
                  targetSdk 34
                  versionCode 210
                  versionName "2.1"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="FinTrackID"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/com/mycompany/fintrackid/MainActivity.java')"
          cat > 'app/src/main/java/com/mycompany/fintrackid/MainActivity.java' <<'EOF_FILE'
          package com.mycompany.fintrackid;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.JsResult;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
              private static final int REQ_FILE = 1, REQ_SAVE = 2;
              private WebView web;
              private ValueCallback<Uri[]> fileCallback;
              private byte[] pendingSave;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);
                  applyTheme(getSharedPreferences("ui", 0).getBoolean("dark", false));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(false);
                  s.setTextZoom(100);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setHorizontalScrollBarEnabled(false);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          try {
                              startActivityForResult(Intent.createChooser(i, "Pilih file cadangan"), REQ_FILE);
                          } catch (Exception e) { fileCallback = null; return false; }
                          return true;
                      }
                      @Override
                      public boolean onJsConfirm(WebView v, String url, String msg, final JsResult r) {
                          new AlertDialog.Builder(MainActivity.this).setMessage(msg)
                              .setPositiveButton("OK", (d, w) -> r.confirm())
                              .setNegativeButton("Batal", (d, w) -> r.cancel())
                              .setOnCancelListener(d -> r.cancel()).show();
                          return true;
                      }
                      @Override
                      public boolean onJsAlert(WebView v, String url, String msg, final JsResult r) {
                          new AlertDialog.Builder(MainActivity.this).setMessage(msg)
                              .setPositiveButton("OK", (d, w) -> r.confirm())
                              .setOnCancelListener(d -> r.confirm()).show();
                          return true;
                      }
                  });
                  web.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  if (b != null) web.restoreState(b); else web.loadUrl("file:///android_asset/index.html");
              }

              private void applyTheme(boolean dark) {
                  int bg = Color.parseColor(dark ? "#0B0F1D" : "#F4F5FB");
                  int nav = Color.parseColor(dark ? "#161B2E" : "#FFFFFF");
                  getWindow().setStatusBarColor(bg);
                  getWindow().setNavigationBarColor(nav);
                  if (web != null) web.setBackgroundColor(bg);
                  View d = getWindow().getDecorView();
                  int f = d.getSystemUiVisibility();
                  int light = View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                  if (Build.VERSION.SDK_INT >= 26) light |= View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                  d.setSystemUiVisibility(dark ? (f & ~light) : (f | light));
                  getSharedPreferences("ui", 0).edit().putBoolean("dark", dark).apply();
              }

              @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("(window.handleBack&&window.handleBack())?'1':'0'", v -> {
                      if (!"\"1\"".equals(v)) finish();
                  });
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == REQ_FILE && fileCallback != null) {
                      Uri[] r = (res == RESULT_OK && data != null && data.getData() != null) ? new Uri[]{data.getData()} : null;
                      fileCallback.onReceiveValue(r);
                      fileCallback = null;
                  } else if (req == REQ_SAVE) {
                      if (res == RESULT_OK && data != null && data.getData() != null && pendingSave != null) {
                          try (OutputStream os = getContentResolver().openOutputStream(data.getData())) {
                              os.write(pendingSave);
                              Toast.makeText(this, "File berhasil disimpan", Toast.LENGTH_SHORT).show();
                          } catch (Exception e) {
                              Toast.makeText(this, "Gagal menyimpan file", Toast.LENGTH_SHORT).show();
                          }
                      }
                      pendingSave = null;
                  }
              }

              class Bridge {
                  @JavascriptInterface
                  public void setTheme(final boolean dark) {
                      runOnUiThread(() -> applyTheme(dark));
                  }

                  @JavascriptInterface
                  public void saveFile(final String name, final String mime, final String content) {
                      runOnUiThread(() -> {
                          pendingSave = content.getBytes(StandardCharsets.UTF_8);
                          Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType(mime);
                          i.putExtra(Intent.EXTRA_TITLE, name);
                          startActivityForResult(i, REQ_SAVE);
                      });
                  }
              }
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_fg.xml')"
          cat > 'app/src/main/res/drawable/ic_fg.xml' <<'EOF_FILE'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#F8F5EE" android:pathData="M30,70h8V54h-8zM46,70h8V42h-8zM62,70h8V32h-8z"/>
              <path android:fillColor="#B8862F" android:pathData="M28,74h52v4H28z"/>
          </vector>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')"
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'EOF_FILE'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/values/colors.xml')"
          cat > 'app/src/main/res/values/colors.xml' <<'EOF_FILE'
          <resources><color name="ic_bg">#2F4B3C</color></resources>
          EOF_FILE
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'EOF_FILE'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_FILE
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF_FILE'
          android.useAndroidX=true
          EOF_FILE
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FinTrackID"
          include ':app'
          EOF_FILE
      - name: Pasang isi aplikasi (index.html)
        run: |
          if [ ! -f index.html ]; then
            echo "::error::File index.html tidak ada di halaman utama repository. Upload index.html dulu."
            exit 1
          fi
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
      - name: Pasang logo kustom (jika ada logo.png)
        run: |
          if [ -f logo.png ]; then
            rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            cp logo.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "Logo kustom dipakai"
          else
            echo "logo.png tidak ada, memakai logo bawaan"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Siapkan Android SDK (bawaan runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FinTrackID-apk
          path: app/build/outputs/apk/debug/app-debug.apk
